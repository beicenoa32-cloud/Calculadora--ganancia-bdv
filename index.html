<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Ciclo Velar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-lg">
        <h1 class="text-xl font-bold text-blue-900 mb-4">Ciclo de Operación</h1>

        <div class="grid grid-cols-2 gap-3">
            <div class="col-span-2">
                <label class="text-[10px] uppercase font-bold text-gray-400">Monto Inicial ($)</label>
                <input type="number" id="monto" value="100" class="w-full p-2 bg-blue-50 rounded-lg font-bold" oninput="calcular()">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400">% Banco</label>
                <input type="number" id="comisionBanco" value="2.5" class="w-full p-2 bg-gray-100 rounded-lg font-bold" oninput="calcular()">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400">% Bpay</label>
                <input type="number" id="comisionBpay" value="4.1" class="w-full p-2 bg-gray-100 rounded-lg font-bold" oninput="calcular()">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400">Tasa Venta</label>
                <input type="number" id="tasaVenta" value="870" class="w-full p-2 bg-gray-100 rounded-lg font-bold" oninput="calcular()">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400">Tasa Oficial</label>
                <input type="number" id="tasaOficial" value="776.40" class="w-full p-2 bg-gray-100 rounded-lg font-bold" oninput="calcular()">
            </div>
        </div>

        <div class="mt-6 bg-gray-50 p-4 rounded-2xl text-sm space-y-2">
            <div class="flex justify-between"><span>Tras 1ra com (Banco):</span> <b id="paso1">0</b></div>
            <div class="flex justify-between"><span>Tras 2da com (Bpay):</span> <b id="paso2">0</b></div>
            <div class="flex justify-between border-t border-gray-300 pt-2"><span>Bolívares obtenidos:</span> <b id="bsObtenidos">0</b></div>
            <div class="flex justify-between text-green-700 pt-4 border-t-2 border-green-200">
                <span>**Resultado Final (Recompra):**</span> 
                <b id="final" class="text-xl">0</b>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            let m = parseFloat(document.getElementById('monto').value) || 0;
            let cb = parseFloat(document.getElementById('comisionBanco').value) || 0;
            let cp = parseFloat(document.getElementById('comisionBpay').value) || 0;
            let tv = parseFloat(document.getElementById('tasaVenta').value) || 0;
            let to = parseFloat(document.getElementById('tasaOficial').value) || 0;

            let paso1 = m * (1 - (cb / 100));
            let paso2 = paso1 * (1 - (cp / 100));
            let bs = paso2 * tv;
            let tasaConMargen = to * 1.005; // Suma el 0.5%
            let final = bs / tasaConMargen;

            document.getElementById('paso1').innerText = paso1.toFixed(2) + " $";
            document.getElementById('paso2').innerText = paso2.toFixed(2) + " $";
            document.getElementById('bsObtenidos').innerText = bs.toLocaleString() + " Bs";
            document.getElementById('final').innerText = final.toFixed(2) + " $";
        }
        calcular();
    </script>
</body>
</html>
