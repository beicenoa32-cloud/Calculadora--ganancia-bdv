<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Velar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-lg">
        <h1 class="text-xl font-bold text-gray-800 mb-4">Calculadora P2P</h1>

        <!-- TASAS -->
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400">Tasa Intervención</label>
                <input type="number" id="tasaIntervencion" value="36.50" class="w-full p-2 bg-gray-50 rounded-lg font-bold" oninput="calcular()">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400">Tasa Venta USDT</label>
                <input type="number" id="tasaVenta" value="42.50" class="w-full p-2 bg-blue-50 rounded-lg font-bold text-blue-700" oninput="calcular()">
            </div>
        </div>

        <!-- BANCO Y COMISIÓN EXTRA -->
        <div class="mb-4">
            <label class="text-[10px] uppercase font-bold text-gray-400">Seleccionar Banco / Método</label>
            <select id="metodo" class="w-full p-3 bg-gray-50 rounded-lg font-bold mb-3" onchange="calcular()">
                <option value="2.5">BDV Virtual (2.5%)</option>
                <option value="1.5">BDV Física (1.5%)</option>
                <option value="2.5">Banco del Tesoro (2.5%)</option>
                <option value="0">Zinli (0%)</option>
                <option value="0">Wally (0%)</option>
            </select>
            
            <label class="text-[10px] uppercase font-bold text-gray-400">Comisión Plataforma (%)</label>
            <input type="number" id="comisionExtra" value="4.1" class="w-full p-2 bg-red-50 rounded-lg font-bold text-red-600" oninput="calcular()">
        </div>

        <!-- OPERACIÓN -->
        <div class="mt-6 border-t pt-4">
            <label class="text-[10px] uppercase font-bold text-gray-400">Monto en Bs</label>
            <input type="number" id="montoBs" placeholder="0.00" class="w-full text-3xl font-bold p-4 text-center mt-2 bg-gray-50 rounded-2xl" oninput="calcular()">
        </div>

        <!-- RESULTADOS -->
        <div class="mt-6 space-y-2">
            <div class="flex justify-between text-gray-500">
                <span>USDT Brutos:</span>
                <span id="bruto" class="font-bold">0.00</span>
            </div>
            <div class="flex justify-between text-red-500">
                <span>Comisión Total:</span>
                <span id="totalComision" class="font-bold">0.00</span>
            </div>
            <div class="flex justify-between text-green-600 text-xl font-bold border-t pt-2 mt-2">
                <span>Recibe Cliente:</span>
                <span id="neto">0.00 USDT</span>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            let tasaVenta = parseFloat(document.getElementById('tasaVenta').value) || 0;
            let montoBs = parseFloat(document.getElementById('montoBs').value) || 0;
            let comisionBanco = parseFloat(document.getElementById('metodo').value) || 0;
            let comisionExtra = parseFloat(document.getElementById('comisionExtra').value) || 0;

            if(montoBs > 0 && tasaVenta > 0) {
                // 1. Calculamos el bruto (Monto / Tasa)
                let bruto = montoBs / tasaVenta;
                
                // 2. Sumamos los porcentajes (Comisión Banco + 4.1%)
                let porcentajeTotal = comisionBanco + comisionExtra;
                let valorComision = bruto * (porcentajeTotal / 100);
                
                // 3. Neto es bruto - comisión
                let neto = bruto - valorComision;

                document.getElementById('bruto').innerText = bruto.toFixed(2) + " USDT";
                document.getElementById('totalComision').innerText = "-" + valorComision.toFixed(2) + " USDT (" + porcentajeTotal.toFixed(1) + "%)";
                document.getElementById('neto').innerText = neto.toFixed(2) + " USDT";
            }
        }
    </script>
</body>
</html>
