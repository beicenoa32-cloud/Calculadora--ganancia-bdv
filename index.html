<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velar Pro Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-gray-50 pb-10">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-blue-900 mb-6">Calculadora Velar</h1>

        <!-- CONFIGURACIÓN DE TASAS Y COMISIONES -->
        <div class="bg-white p-5 rounded-3xl shadow-sm mb-4 border border-gray-100">
            <h2 class="text-xs font-bold text-gray-400 mb-4 uppercase">Configuración</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-gray-400 uppercase">Tasa Venta USDT</label>
                    <input type="number" id="tasaVenta" value="42.50" class="w-full bg-blue-50 p-2 rounded-lg font-bold" oninput="calcular()">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 uppercase">Comisión Tarjeta (%)</label>
                    <input type="number" id="comisionTarjeta" value="2" class="w-full bg-red-50 p-2 rounded-lg font-bold" oninput="calcular()">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 uppercase">Comisión Bpay (%)</label>
                    <input type="number" id="comisionBpay" value="1" class="w-full bg-red-50 p-2 rounded-lg font-bold" oninput="calcular()">
                </div>
            </div>
        </div>

        <!-- OPERACIÓN -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
            <label class="text-xs text-gray-400 uppercase">Monto a cambiar (Bs)</label>
            <input type="number" id="montoBs" placeholder="0.00" class="w-full text-3xl font-bold p-4 text-center mt-2" oninput="calcular()">

            <div class="mt-6 space-y-3">
                <div class="flex justify-between border-b pb-2">
                    <span class="text-gray-500">Recibe (Neto):</span>
                    <span class="font-bold text-lg" id="resNeto">0.00 USDT</span>
                </div>
                <div class="flex justify-between border-b pb-2">
                    <span class="text-red-500 text-sm">Comisiones totales:</span>
                    <span class="font-bold text-red-500" id="resComisiones">0.00 USDT</span>
                </div>
                <div class="flex justify-between pt-2">
                    <span class="text-green-600 font-bold">Tu Ganancia:</span>
                    <span class="font-bold text-xl text-green-600" id="resGanancia">0.00 USDT</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            let tasa = parseFloat(document.getElementById('tasaVenta').value) || 0;
            let cTarjeta = parseFloat(document.getElementById('comisionTarjeta').value) || 0;
            let cBpay = parseFloat(document.getElementById('comisionBpay').value) || 0;
            let montoBs = parseFloat(document.getElementById('montoBs').value) || 0;

            if(montoBs > 0 && tasa > 0) {
                let totalUsdt = montoBs / tasa;
                let totalComisiones = totalUsdt * ((cTarjeta + cBpay) / 100);
                let netoParaCliente = totalUsdt - totalComisiones;
                
                // Aquí calculamos la ganancia basada en lo que resta después de comisiones
                // (Si quieres cambiar cómo se calcula tu ganancia específica, avísame)
                let ganancia = totalComisiones; 

                document.getElementById('resNeto').innerText = netoParaCliente.toFixed(2) + " USDT";
                document.getElementById('resComisiones').innerText = totalComisiones.toFixed(2) + " USDT";
                document.getElementById('resGanancia').innerText = ganancia.toFixed(2) + " USDT";
            }
        }
    </script>
</body>
</html>
